<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 420px; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; background: #0a0a0a; color: #e0e0e0; font-size: 13px; }

.hdr { padding: 16px 18px 12px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
.hdr h1 { font-size: 16px; color: #fff; font-weight: 700; letter-spacing: -0.3px; }
.hdr .badge { font-size: 10px; color: #4a9; border: 1px solid #4a9; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.5px; }
.hdr .badge.connected { color: #e8b339; border-color: #e8b339; }
.hdr .sub { font-size: 11px; color: #555; margin-top: 3px; }

.section { padding: 10px 18px; border-bottom: 1px solid #111; }
.section label { font-size: 10px; color: #666; letter-spacing: 0.8px; display: block; margin-bottom: 4px; text-transform: uppercase; }

textarea { width: 100%; background: #0e0e0e; border: 1px solid #222; color: #ccc; padding: 8px 10px; font-family: inherit; font-size: 13px; border-radius: 4px; resize: vertical; min-height: 48px; max-height: 120px; }
textarea:focus { outline: none; border-color: #4a9; }

.stats { padding: 8px 18px; font-size: 12px; color: #555; border-bottom: 1px solid #111; display: flex; justify-content: space-between; }
.stats .num { color: #4a9; font-weight: 600; }

.actions { padding: 12px 18px; display: flex; gap: 8px; }
.btn { flex: 1; padding: 11px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 4px; border: 1px solid; transition: all 0.15s; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn.compile { background: #0a1a12; color: #4a9; border-color: #4a9; }
.btn.compile:hover:not(:disabled) { background: #4a9; color: #0a0a0a; }
.btn.close { background: #1a0a0a; color: #c44; border-color: #c44; }
.btn.close:hover:not(:disabled) { background: #c44; color: #0a0a0a; }
.btn.history { background: #0e0e1a; color: #69c; border-color: #69c; }
.btn.history:hover:not(:disabled) { background: #69c; color: #0a0a0a; }

.status { padding: 6px 18px; font-size: 11px; color: #555; min-height: 18px; }
.status.ok { color: #4a9; }
.status.err { color: #c44; }
.status.compiling { color: #aa7; }

.result { padding: 10px 18px; display: none; }
.result.visible { display: block; }
.result a { color: #4a9; text-decoration: none; font-size: 12px; font-weight: 600; }
.result a:hover { text-decoration: underline; }
.result .sid { font-size: 10px; color: #444; margin-top: 4px; }
.result .noise-info { font-size: 11px; color: #aa7; margin-top: 6px; }
.result .preview { margin-top: 8px; font-size: 11px; color: #888; line-height: 1.5; max-height: 120px; overflow-y: auto; white-space: pre-wrap; background: #0e0e0e; padding: 8px; border-radius: 4px; border: 1px solid #1a1a1a; }

.cfg-toggle { padding: 6px 18px; border-bottom: 1px solid #111; }
.cfg-toggle span { font-size: 10px; color: #444; cursor: pointer; letter-spacing: 0.8px; }
.cfg-toggle span:hover { color: #666; }
.cfg-body { display: none; }
.cfg-body.open { display: block; }
.cfg-body .section input { width: 100%; background: #0e0e0e; border: 1px solid #222; color: #ccc; padding: 6px 8px; font-family: inherit; font-size: 11px; border-radius: 3px; }
.cfg-body .section input:focus { outline: none; border-color: #4a9; }

.history-panel { display: none; padding: 8px 18px; max-height: 200px; overflow-y: auto; }
.history-panel.open { display: block; }
.history-item { padding: 8px 0; border-bottom: 1px solid #111; font-size: 11px; }
.history-item:last-child { border-bottom: none; }
.history-item .h-mission { color: #ccc; font-weight: 500; margin-bottom: 2px; }
.history-item .h-meta { color: #555; font-size: 10px; }
.history-item .h-link { color: #4a9; text-decoration: none; font-size: 10px; }
.history-empty { color: #444; font-size: 11px; padding: 8px 0; }

@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
.spinning { animation: pulse 1.2s infinite; }

.footer { padding: 8px 18px; font-size: 10px; color: #333; text-align: center; }
.footer a { color: #444; text-decoration: none; }
.footer a:hover { color: #666; }

.meeting-section .meeting-status { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; }
.meeting-section .meeting-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; display: inline-block; flex-shrink: 0; }
.meeting-section .meeting-dot.active { background: #4a9; box-shadow: 0 0 6px #4a9; }
.meeting-section .meeting-dot.error { background: #c44; }
.meeting-section .meeting-history { margin-top: 6px; max-height: 100px; overflow-y: auto; }
.meeting-section .meeting-item { font-size: 10px; color: #888; padding: 3px 0; border-top: 1px solid #111; display: flex; justify-content: space-between; }
.meeting-section .meeting-item .m-platform { color: #69c; }
.meeting-section .meeting-item .m-time { color: #555; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>GetRida.Work</h1>
    <div class="sub">Tab compiler → workspace agent</div>
  </div>
  <div class="badge" id="modeBadge">FREE</div>
</div>

<div class="cfg-toggle">
  <span id="cfgToggle">CONFIG</span>
</div>
<div class="cfg-body" id="cfgBody">
  <div class="section">
    <label>Compile Endpoint</label>
    <input type="text" id="endpoint" value="https://getrida.work/api/v1/compile" />
  </div>
</div>

<div class="section">
  <label>Mission</label>
  <textarea id="mission" placeholder="What are you working on? What's the mission for these tabs?"></textarea>
</div>

<div class="section meeting-section" id="meetingSection">
  <label>Meeting Bot</label>
  <div class="meeting-status" id="meetingStatus">
    <span class="meeting-dot" id="meetingDot"></span>
    <span id="meetingLabel">Idle — open Meet/Zoom/Teams to dispatch</span>
  </div>
  <div class="meeting-history" id="meetingHistory"></div>
</div>

<div class="stats" id="stats">Loading tabs...</div>

<div class="actions">
  <button class="btn compile" id="compileBtn">COMPILE</button>
  <button class="btn close" id="closeBtn" disabled>CLOSE NOISE</button>
  <button class="btn history" id="historyBtn">HISTORY</button>
</div>

<div class="status" id="status"></div>

<div class="result" id="result">
  <a id="viewLink" href="#" target="_blank">View report</a>
  <div class="sid" id="sessionId"></div>
  <div class="noise-info" id="noiseInfo"></div>
  <div class="preview" id="preview"></div>
</div>

<div class="history-panel" id="historyPanel">
  <div id="historyList"></div>
</div>

<div class="footer">
  <a href="https://getrida.work/extension" target="_blank">getrida.work/extension</a>
</div>

<script src="popup.js"></script>
</body>
</html>
